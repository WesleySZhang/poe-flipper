name: Check for a new league

# Detects when poe.ninja starts serving a different challenge league than lib/league-recency.ts's
# hardcoded CURRENT_LEAGUE, and opens a pull request with the fix (scripts/sync-current-league.ts
# does the actual detection + file edit - see its own comment for the full reasoning).
#
# Deliberately opens a PR rather than pushing straight to master, even though that means someone
# still has to click Merge: this constant feeds live economy data (poe.ninja lookups, Faustus,
# divination card pricing) to every visitor of the site, so a bad detection - a poe.ninja hiccup,
# an unexpected reordering of its leagues endpoint - should get a human's eyes before it deploys,
# not skip straight to it. In exchange, the actual noticing and editing is fully automatic - the
# only manual step left is reviewing and merging a pull request GitHub already notified you about
# (then deploying - see docs/new-league.md).
#
# Runs independently of precompute-predictions.yml (different concern, different schedule) - if a
# swap happens, that job keeps computing against the outgoing league (harmlessly - poe.ninja simply
# stops returning fresh data for an ended league) until this PR is merged, same one-day-ish lag the
# manual process it replaces already had.

on:
  schedule:
    - cron: "5 0 * * *" # once daily, shortly before precompute-predictions.yml's own 00:10 UTC run
  workflow_dispatch: {} # manual trigger, e.g. to check right after a league you know just launched

permissions:
  contents: write
  pull-requests: write

jobs:
  check-league:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Check poe.ninja's live league against the hardcoded CURRENT_LEAGUE
        id: check
        run: npx tsx scripts/sync-current-league.ts

      - name: Open a pull request with the swap, if one was detected
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Swap CURRENT_LEAGUE to ${{ steps.check.outputs.new_league }}"
          title: "New challenge league detected: ${{ steps.check.outputs.new_league }}"
          body: |
            poe.ninja is now serving **${{ steps.check.outputs.new_league }}** instead of
            **${{ steps.check.outputs.old_league }}**, so a new challenge league has likely launched.

            Changes `lib/league-recency.ts` only: `CURRENT_LEAGUE`, and the new league's start date,
            **${{ steps.check.outputs.start_date }}** (from ${{ steps.check.outputs.start_source }}).

            **Before merging:**
            - Check this is a real launch, not a poe.ninja hiccup.
            - Check the start date against the launch announcement. League days count from it.

            **After merging** (full plan: `docs/new-league.md`):
            1. Run **Deploy to production**. The daily job reruns by itself.
            2. If ${{ steps.check.outputs.old_league }} isn't in the training set yet, run
               **Retrain model** with it once poe.ninja has exported it.

            Opened by `.github/workflows/check-current-league-swap.yml` (`scripts/sync-current-league.ts`).
          branch: auto/current-league-swap
          delete-branch: true
