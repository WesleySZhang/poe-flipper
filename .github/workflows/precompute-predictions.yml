name: Precompute predictions

# Runs two independent daily jobs and publishes both to the "data" branch in one commit:
#  - scripts/precompute-predictions.ts: the learned model for every "Days ahead" value the UI
#    supports - see lib/precomputed-predictions.ts (why: avoids every page load waiting on a live
#    model run).
#  - scripts/precompute-price-history.ts: today's live prices, appended to a growing per-league CSV
#    pair matching scripts/ingest-history.ts's own format - see that script's module doc for why (the
#    currently active league otherwise has no daily price history at all until someone manually
#    downloads poe.ninja's export after it ends).
# "data" is configured (see vercel.json) to never trigger a Vercel deployment - this app's committed
# database is ~72MB, and a deployment re-bundles the whole app regardless of how small the actual
# change was.
#
# Runs once daily on a schedule, on-demand (workflow_dispatch), and automatically on a push to
# master that touches the prediction algorithm itself (see the `push.paths` filter below) - so
# merging an algorithm change doesn't sit stale in production until the next scheduled run.

on:
  schedule:
    # lib/league-day.ts's currentLeagueDay() flips to a new day at exactly 00:00 UTC. Running this
    # job at 6am UTC used to leave a 6-hour daily window (00:00-06:00 UTC) where the frontend already
    # considered it the new league day but neither predictions.json nor today's price-history CSV row
    # existed yet - a gap in the current-league real-history line, plus every precomputed-predictions
    # lookup missing (lib/precomputed-predictions.ts's fetchValidPrecomputed requires an exact
    # currentDay match) and falling back to a live model run per duration. Running shortly after
    # midnight instead shrinks that window to ~10 minutes.
    - cron: "10 0 * * *"
  workflow_dispatch: {} # manual trigger, e.g. right after fixing something
  push:
    # Without this, predictions.json only reflects an algorithm change once the NEXT scheduled run
    # happens - up to almost a full day of visitors seeing stale suggestions computed with the old
    # algorithm even though master already has the fix. Re-running this job the moment a change
    # actually lands closes that gap. Scoped to exactly the files precompute-predictions.ts's own
    # call chain depends on (scripts/precompute-predictions.ts -> lib/flip-suggestions.ts ->
    # lib/growth-ratios.ts/lib/confidence.ts/lib/prediction-model.ts/lib/prediction-features.ts/
    # lib/models/predictor.json, plus lib/predicted-suggestion.ts for the rationale text) - not
    # every push to master, which would waste a run (and an extra, harmless but pointless
    # today-row rewrite in the price-history CSVs) on changes with no effect on the output at all.
    branches: [master]
    paths:
      - "scripts/precompute-predictions.ts"
      - "lib/flip-suggestions.ts"
      - "lib/growth-ratios.ts"
      - "lib/confidence.ts"
      - "lib/prediction-model.ts"
      - "lib/prediction-features.ts"
      - "lib/models/predictor.json"
      - "lib/predicted-suggestion.ts"

permissions:
  contents: write

jobs:
  precompute:
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          lfs: true # db/history.duckdb is Git LFS-tracked - without this the checkout only gets a pointer file

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Compute today's predictions
        run: npx tsx --conditions=react-server scripts/precompute-predictions.ts

      - name: Snapshot today's prices into the price-history CSVs
        run: npx tsx scripts/precompute-price-history.ts

      - name: Publish to the data branch
        run: |
          set -e
          cp predictions.json /tmp/predictions.json
          rm -rf /tmp/history && cp -r history /tmp/history
          cp vercel.json /tmp/vercel.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Always a fresh orphan branch, force-pushed over whatever "data" currently is, rather than
          # committing on top of yesterday's commit - this branch is meant to hold LATEST FILE
          # CONTENT, not a history of every past commit. predictions.json is deliberately a full,
          # disposable snapshot every run (see its own module doc); history/'s CSVs deliberately DO
          # grow (see scripts/precompute-price-history.ts's module doc), but that growth lives in the
          # FILE CONTENT itself (this job downloaded yesterday's CSVs and appended to them before this
          # step ran) - git's own commit history doesn't need to grow too for that to work, and
          # keeping it flat is what stops this branch from bloating forever.
          git checkout --orphan data-publish
          git rm -rf . > /dev/null

          # Both are .gitignore'd on every other branch (only ever meaningful here, freshly
          # generated) - force-add to override that on this one-off branch.
          cp /tmp/predictions.json predictions.json
          cp -r /tmp/history history
          # vercel.json ALSO has to be re-added here, not just carried over from master - Vercel
          # decides whether to deploy a push by reading git.deploymentEnabled from the vercel.json in
          # the COMMIT ACTUALLY BEING PUSHED, not master's. git rm -rf . above wipes it out along with
          # everything else, so without this copy every push here would silently lose its "never
          # deploy this branch" rule and fall back to Vercel's default (deploy every push) - which is
          # exactly what happened before this line existed: a Preview deployment was attempted (and
          # failed, since this branch has no app to build) for every daily run.
          cp /tmp/vercel.json vercel.json
          git add -f predictions.json history vercel.json
          git commit -m "Update precomputed predictions and price history"
          git push --force origin data-publish:data
