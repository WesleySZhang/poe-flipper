name: Track sold listings

# Runs the sold listing tracker (scripts/track-sold-listings.ts) for ~5.5 hours, every 6 hours, then
# publishes its files to the "sold-tracker" branch (not "data": the daily job rebuilds that from
# scratch every run):
#   state/<League>.json          the tracker's state, restored at the start of the next run
#   sold-listings/<League>.json  what the Sold Listings page reads (lib/sold-listings.ts)
#   ended/<League>/<YYYY-MM>.jsonl  every listing that ended - the full history
#
# The page's data changes only when the last step publishes - all at once, at the end of a run.
# The tracker saves every few minutes while it runs, and the publish step runs even when tracking
# fails partway, so a failed run still publishes what it got.
#
# Why this schedule: the trade site allows ~7,000 listing checks per 6 hours at the tracker's 70%
# margin, so running (nearly) all the time is what lets it check up to 6,000 listings every 6 hours.
# Fetches are paced across the run rather than spent in bursts. GitHub starts scheduled runs late;
# the concurrency group keeps a late run and the next one from overlapping.
#
# Untested from GitHub's runners: whether pathofexile.com lets their IPs through. If it doesn't, the
# run fails with a 403 "blocked before reaching the API" - run the tracker somewhere else instead
# (`npm run sold:track`; see the README).

on:
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to run, in minutes"
        default: "330"

permissions:
  contents: write

concurrency:
  group: sold-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Restore the tracker's state from the sold-tracker branch
        run: |
          mkdir -p .sold-tracker
          if git fetch --depth=1 origin sold-tracker; then
            git archive FETCH_HEAD | tar -x -C .sold-tracker
          else
            echo "No sold-tracker branch yet - starting fresh."
          fi

      - name: Track
        run: npx tsx scripts/track-sold-listings.ts --minutes "${{ github.event.inputs.minutes || '330' }}" --dir .sold-tracker

      # Runs even when tracking failed partway, so the state saved so far isn't lost.
      - name: Publish to the sold-tracker branch
        if: always()
        run: |
          set -e
          if [ ! -d .sold-tracker/state ]; then
            echo "Nothing to publish."
            exit 0
          fi
          rm -rf /tmp/sold-tracker && mkdir -p /tmp/sold-tracker
          for d in state sold-listings ended; do
            if [ -d ".sold-tracker/$d" ]; then cp -r ".sold-tracker/$d" "/tmp/sold-tracker/$d"; fi
          done
          find /tmp/sold-tracker -name '*.tmp' -delete
          cp vercel.json /tmp/vercel.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # A fresh orphan commit each run, force-pushed, like the data branch: the branch holds the
          # latest files, not a history of every run. vercel.json is re-added so Vercel reads its
          # "never deploy this branch" rule from the pushed commit itself.
          git checkout --orphan sold-tracker-publish
          git rm -rf . > /dev/null
          rm -rf state sold-listings ended .sold-tracker
          cp -r /tmp/sold-tracker/. .
          cp /tmp/vercel.json vercel.json
          git add -f state sold-listings vercel.json
          if [ -d ended ]; then git add -f ended; fi
          git commit -m "Update sold listings"
          git push --force origin sold-tracker-publish:sold-tracker
